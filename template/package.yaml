<<: !include "../shared/package-year.yaml"

library:
  source-dirs: src
  dependencies:
  - Helpers

name: AdventOfCode{{YEAR}}
executables:
  AdventOfCode{{YEAR}}-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - AdventOfCode{{YEAR}}
  aoc-prebuild:
    main: Main.hs
    source-dirs: prebuild
    dependencies:
    - Helpers
    - AdventOfCode{{YEAR}}
    - directory >= 1.3.6.0
tests:
  AdventOfCode{{YEAR}}-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - AdventOfCode{{YEAR}}
