<<: !include "../shared/package-year.yaml"

library:
  source-dirs: src
  dependencies:
  - Helpers

name: AdventOfCode2015
executables:
  AdventOfCode2015-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - AdventOfCode2015
  aoc-prebuild:
    main: Main.hs
    source-dirs: prebuild
    dependencies:
    - Helpers
    - AdventOfCode2015
    - directory >= 1.3.6.0
tests:
  AdventOfCode2015-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - AdventOfCode2015
